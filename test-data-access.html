<!DOCTYPE html>
<html>
<head>
    <title>Test Data Access</title>
</head>
<body>
    <h1>Testing Data File Access</h1>
    <div id="result"></div>
    <script>
        async function testDataAccess() {
            const resultDiv = document.getElementById('result');
            try {
                const response = await fetch('/data/riwaya/hafs/pages/info.json');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = '<p style="color: green;">✓ Data file accessible!</p>';
                    resultDiv.innerHTML += `<p>Number of pages: ${data.number_of_pages}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">✗ Failed to load: ${response.status} ${response.statusText}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }
        testDataAccess();
    </script>
</body>
</html>
